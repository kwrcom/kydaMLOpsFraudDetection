events {
    worker_connections 1024;
}

http {
    # no upstream configured for frontend — frontend has been removed

    server {
        # HTTP redirect to HTTPS
        listen 80;
        server_name kyda.tech;
        return 301 https://$host$request_uri;
    }

    server {
        # HTTPS configuration
        listen 443 ssl;
        server_name kyda.tech;

        # SSL certificate placeholders – replace with actual paths
        ssl_certificate /etc/ssl/certs/kyda.crt;
        ssl_certificate_key /etc/ssl/private/kyda.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
